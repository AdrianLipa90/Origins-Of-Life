name: First RNA Local Context v0.9

on:
  pull_request:
    paths:
      - "docs/FIRST_RNA_LOCAL_CONTEXT_PREREG_V0_9.md"
      - "origins/analysis/first_rna_local_context_v09.py"
      - "scripts/run_first_rna_local_context_v09.py"
      - "tests/test_first_rna_local_context_v09.py"
      - ".github/workflows/first-rna-local-context-v09.yml"

jobs:
  local-context-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy pytest

      - name: Run local-context representation calibration
        run: |
          python scripts/run_first_rna_local_context_v09.py

      - name: Run local-context tests
        run: |
          pytest -q tests/test_first_rna_local_context_v09.py

      - name: Upload local-context receipt
        uses: actions/upload-artifact@v4
        with:
          name: first-rna-local-context-v09
          path: first_rna_local_context_v09/
          if-no-files-found: error
