name: First RNA Base Holdout v0.4

on:
  pull_request:
    paths:
      - "docs/FIRST_RNA_BASE_HOLDOUT_PREREG_V0_4.md"
      - "origins/analysis/first_rna_base_holdout_v04.py"
      - "scripts/run_first_rna_base_holdout_v04.py"
      - "tests/test_first_rna_base_holdout_v04.py"
      - ".github/workflows/first-rna-base-holdout-v04.yml"

jobs:
  base-specific-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy

      - name: Run held-out C validation
        run: |
          python scripts/run_first_rna_base_holdout_v04.py

      - name: Upload holdout receipt
        uses: actions/upload-artifact@v4
        with:
          name: first-rna-base-holdout-v04
          path: first_rna_base_holdout_v04/
          if-no-files-found: error
