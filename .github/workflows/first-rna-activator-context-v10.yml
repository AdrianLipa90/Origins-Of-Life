name: First RNA Activator Context v0.10

on:
  pull_request:
    paths:
      - "docs/FIRST_RNA_ACTIVATOR_CONTEXT_PREREG_V0_10.md"
      - "origins/analysis/first_rna_activator_context_v10.py"
      - "scripts/run_first_rna_activator_context_v10.py"
      - "tests/test_first_rna_activator_context_v10.py"
      - ".github/workflows/first-rna-activator-context-v10.yml"

jobs:
  activator-context-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy pytest

      - name: Run activator-context capability audit
        run: |
          python scripts/run_first_rna_activator_context_v10.py

      - name: Run activator-context tests
        run: |
          pytest -q tests/test_first_rna_activator_context_v10.py

      - name: Upload activator-context receipt
        uses: actions/upload-artifact@v4
        with:
          name: first-rna-activator-context-v10
          path: first_rna_activator_context_v10/
          if-no-files-found: error
