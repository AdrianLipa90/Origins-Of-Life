name: Exotic Relational Benchmark v0.1

on:
  pull_request:
    paths:
      - 'origins/exobiology/**'
      - 'tests/test_exotic_relational_benchmark_v01.py'
      - 'scripts/run_exotic_relational_benchmark.py'
      - '.github/workflows/exotic-relational-benchmark-v01.yml'
  push:
    branches:
      - main
    paths:
      - 'origins/exobiology/**'
      - 'scripts/run_exotic_relational_benchmark.py'
      - '.github/workflows/exotic-relational-benchmark-v01.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas pytest

      - name: Run matched exotic relational benchmark
        run: |
          python scripts/run_exotic_relational_benchmark.py \
            --outdir exotic_benchmark_artifact \
            --steps 300 \
            --nx 24 \
            --ny 24 \
            --seeds 11 23 47

      - name: Validate benchmark artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("exotic_benchmark_artifact/exotic_relational_benchmark_v01.json")
          data = json.loads(p.read_text())
          assert data["schema"] == "ORIGINS_EXOTIC_RELATIONAL_BENCHMARK_V0_1"
          assert data["comparison_scope"] == "SHARED_RELATIONAL_OBSERVABLES_ONLY"
          assert data["manifest"]["ranking_allowed"] is False
          assert data["row_count"] == 30
          assert data["summary"]["cross_profile_ranking"] is False
          assert all(
              row["material_residual_abs"] <= 2e-9 * max(1.0, abs(row["material_initial"]))
              for row in data["rows"]
          )
          PY

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: exotic-relational-benchmark-v01
          path: exotic_benchmark_artifact/
          if-no-files-found: error
