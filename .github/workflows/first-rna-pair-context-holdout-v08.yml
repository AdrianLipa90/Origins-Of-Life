name: First RNA Pair Context Holdout v0.8

on:
  pull_request:
    paths:
      - "docs/FIRST_RNA_PAIR_CONTEXT_HOLDOUT_PREREG_V0_8.md"
      - "origins/analysis/first_rna_pair_context_holdout_v08.py"
      - "scripts/run_first_rna_pair_context_holdout_v08.py"
      - "tests/test_first_rna_pair_context_holdout_v08.py"
      - ".github/workflows/first-rna-pair-context-holdout-v08.yml"

jobs:
  pair-context-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy pytest

      - name: Run pair-context holdout
        run: |
          python scripts/run_first_rna_pair_context_holdout_v08.py

      - name: Run pair-context tests
        run: |
          pytest -q tests/test_first_rna_pair_context_holdout_v08.py

      - name: Upload pair-context receipt
        uses: actions/upload-artifact@v4
        with:
          name: first-rna-pair-context-holdout-v08
          path: first_rna_pair_context_holdout_v08/
          if-no-files-found: error
