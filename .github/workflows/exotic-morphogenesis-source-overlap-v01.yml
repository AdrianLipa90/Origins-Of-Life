name: Exotic Morphogenesis Source Overlap v0.1

on:
  pull_request:
    paths:
      - 'origins/exobiology/**'
      - 'tests/test_exotic_morphogenesis_source_overlap_v01.py'
      - 'scripts/run_exotic_morphogenesis_source_overlap.py'
      - '.github/workflows/exotic-morphogenesis-source-overlap-v01.yml'
  push:
    branches:
      - main
    paths:
      - 'origins/exobiology/**'
      - 'scripts/run_exotic_morphogenesis_source_overlap.py'
      - '.github/workflows/exotic-morphogenesis-source-overlap-v01.yml'

permissions:
  contents: read

jobs:
  morphogenesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas pytest

      - name: Run morphogenesis source-overlap diagnostic
        run: |
          python scripts/run_exotic_morphogenesis_source_overlap.py \
            --outdir exotic_morphogenesis_artifact \
            --nx 24 \
            --ny 24 \
            --seeds 11 23 47 \
            --horizons 300 1000 3000

      - name: Validate morphogenesis artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("exotic_morphogenesis_artifact/exotic_morphogenesis_source_overlap_v01.json")
          data = json.loads(p.read_text())
          m = data["manifest"]
          assert m["schema"] == "ORIGINS_EXOTIC_MORPHOGENESIS_SOURCE_OVERLAP_V0_1"
          assert m["ranking_allowed"] is False
          assert m["parameter_tuning_allowed"] is False
          assert m["threshold_tuning_allowed"] is False
          assert data["row_count"] == 18

          bounded = (
              "source_distribution_overlap",
              "source_cosine_similarity",
              "state_distribution_overlap",
              "state_cosine_similarity",
              "boundary_source_information_gradient_cosine",
          )
          for row in data["rows"]:
              assert row["physical_binding"] == "OPEN"
              assert row["ranking_allowed"] is False
              for key in bounded:
                  assert 0.0 <= row[key] <= 1.0 + 1e-12
          PY

      - name: Upload morphogenesis artifact
        uses: actions/upload-artifact@v4
        with:
          name: exotic-morphogenesis-source-overlap-v01
          path: exotic_morphogenesis_artifact/
          if-no-files-found: error
