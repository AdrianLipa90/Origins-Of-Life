name: Contractible Island Ancestry v0.1

on:
  pull_request:
    paths:
      - 'origins/exobiology/**'
      - 'tests/test_contractible_island_ancestry_v01.py'
      - 'scripts/run_contractible_island_ancestry.py'
      - '.github/workflows/contractible-island-ancestry-v01.yml'
  push:
    branches:
      - main
    paths:
      - 'origins/exobiology/**'
      - 'scripts/run_contractible_island_ancestry.py'
      - '.github/workflows/contractible-island-ancestry-v01.yml'

permissions:
  contents: read

jobs:
  ancestry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas pytest

      - name: Run ancestry trace
        run: |
          python scripts/run_contractible_island_ancestry.py \
            --outdir contractible_island_ancestry_artifact \
            --horizon 10000 \
            --nx 24 \
            --ny 24 \
            --seeds 11 23 47

      - name: Validate ancestry artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("contractible_island_ancestry_artifact/contractible_island_ancestry_v01.json")
          data = json.loads(p.read_text())
          m = data["manifest"]
          assert m["schema"] == "ORIGINS_CONTRACTIBLE_ISLAND_ANCESTRY_TRACE_V0_1"
          assert m["model_mutation_allowed"] is False
          assert m["parameter_tuning_allowed"] is False
          assert m["threshold_tuning_allowed"] is False
          assert m["ranking_allowed"] is False
          assert data["row_count"] == 3

          allowed = set(m["lineage_classes"])
          for row in data["rows"]:
              assert row["physical_binding"] == "OPEN"
              assert row["ranking_allowed"] is False
              for transition in row["transitions"]:
                  assert transition["classification"] in allowed
          PY

      - name: Upload ancestry artifact
        uses: actions/upload-artifact@v4
        with:
          name: contractible-island-ancestry-v01
          path: contractible_island_ancestry_artifact/
          if-no-files-found: error
