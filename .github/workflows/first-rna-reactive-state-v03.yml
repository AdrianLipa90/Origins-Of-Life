name: First RNA Reactive State v0.3

on:
  pull_request:
    paths:
      - "docs/FIRST_RNA_REACTIVE_STATE_PREREG_V0_3.md"
      - "origins/analysis/first_rna_reactive_state_v03.py"
      - "scripts/run_first_rna_reactive_state_v03.py"
      - "tests/test_first_rna_reactive_state_v03.py"
      - ".github/workflows/first-rna-reactive-state-v03.yml"

jobs:
  reactive-state-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy

      - name: Run reactive-state calibration
        run: |
          python scripts/run_first_rna_reactive_state_v03.py

      - name: Upload calibration receipt
        uses: actions/upload-artifact@v4
        with:
          name: first-rna-reactive-state-v03
          path: first_rna_reactive_state_v03/
          if-no-files-found: error
