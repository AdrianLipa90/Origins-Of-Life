name: Hydrocarbon Information Diffusion Ablation v0.1

on:
  pull_request:
    paths:
      - 'origins/exobiology/**'
      - 'tests/test_hydrocarbon_information_diffusion_ablation_v01.py'
      - 'scripts/run_hydrocarbon_information_diffusion_ablation.py'
      - '.github/workflows/hydrocarbon-information-diffusion-ablation-v01.yml'
  push:
    branches:
      - main
    paths:
      - 'origins/exobiology/**'
      - 'scripts/run_hydrocarbon_information_diffusion_ablation.py'
      - '.github/workflows/hydrocarbon-information-diffusion-ablation-v01.yml'

permissions:
  contents: read

jobs:
  information-diffusion-ablation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas pytest

      - name: Run information-diffusion ablation
        run: |
          python scripts/run_hydrocarbon_information_diffusion_ablation.py \
            --outdir hydrocarbon_information_diffusion_ablation_artifact \
            --horizon 10000 \
            --nx 24 \
            --ny 24 \
            --seeds 11 23 47

      - name: Validate ablation artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("hydrocarbon_information_diffusion_ablation_artifact/hydrocarbon_information_diffusion_ablation_v01.json")
          data = json.loads(p.read_text())
          m = data["manifest"]
          assert m["schema"] == "ORIGINS_HYDROCARBON_INFORMATION_DIFFUSION_ABLATION_V0_1"
          assert m["only_varied_operator"] == "information_diffusion"
          assert m["same_seed_required"] is True
          assert m["same_thresholds_required"] is True
          assert m["same_other_parameters_required"] is True
          assert m["causal_ablation"] is True
          assert m["parameter_tuning_allowed"] is False
          assert m["threshold_tuning_allowed"] is False
          assert m["ranking_allowed"] is False
          assert data["row_count"] == 6

          for row in data["rows"]:
              assert row["physical_binding"] == "OPEN"
              assert row["causal_ablation"] is True
              assert row["material_residual_abs"] < 1e-8
              if row["diffusion_condition"] == "INFORMATION_DIFFUSION_OFF":
                  assert row["information_diffusion"] == 0.0
              else:
                  assert row["information_diffusion"] > 0.0
          PY

      - name: Upload diffusion-ablation artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydrocarbon-information-diffusion-ablation-v01
          path: hydrocarbon_information_diffusion_ablation_artifact/
          if-no-files-found: error
