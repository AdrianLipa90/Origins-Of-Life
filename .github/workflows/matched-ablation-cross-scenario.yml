name: Matched Ablation Cross Scenario

on:
  pull_request:
    paths:
      - "origins/analysis/ablation.py"
      - "origins/simulator/universal.py"
      - "origins/topology/constraints.py"
      - "scripts/run_matched_ablation.py"
      - ".github/workflows/matched-ablation-cross-scenario.yml"

jobs:
  cross-scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scenario: [A, B, C, D, E]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy

      - name: Run matched factorial ablation
        run: |
          python scripts/run_matched_ablation.py \
            --scenario ${{ matrix.scenario }} \
            --seeds 101,102,103,104,105 \
            --hours 12 \
            --nx 32 \
            --ny 32 \
            --dt-h 0.05 \
            --outdir ablation_cross_${{ matrix.scenario }}

      - name: Upload scenario artifact
        uses: actions/upload-artifact@v4
        with:
          name: matched-ablation-${{ matrix.scenario }}
          path: ablation_cross_${{ matrix.scenario }}/
          if-no-files-found: error
