name: Hydrocarbon Closure Dropout v0.1

on:
  pull_request:
    paths:
      - 'origins/exobiology/**'
      - 'tests/test_hydrocarbon_closure_dropout_v01.py'
      - 'scripts/run_hydrocarbon_closure_dropout.py'
      - '.github/workflows/hydrocarbon-closure-dropout-v01.yml'
  push:
    branches:
      - main
    paths:
      - 'origins/exobiology/**'
      - 'scripts/run_hydrocarbon_closure_dropout.py'
      - '.github/workflows/hydrocarbon-closure-dropout-v01.yml'

permissions:
  contents: read

jobs:
  dropout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas pytest

      - name: Run hydrocarbon closure-dropout diagnostic
        run: |
          python scripts/run_hydrocarbon_closure_dropout.py \
            --outdir hydrocarbon_dropout_artifact \
            --horizon 10000 \
            --nx 24 \
            --ny 24 \
            --seeds 11 23 47

      - name: Validate dropout artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("hydrocarbon_dropout_artifact/hydrocarbon_closure_dropout_v01.json")
          data = json.loads(p.read_text())
          m = data["manifest"]
          assert m["schema"] == "ORIGINS_HYDROCARBON_CLOSURE_DROPOUT_V0_1"
          assert m["profile"] == "HYDROCARBON_CANDIDATE"
          assert m["parameter_tuning_allowed"] is False
          assert m["threshold_tuning_allowed"] is False
          assert m["ranking_allowed"] is False
          assert data["row_count"] == 3

          for row in data["rows"]:
              assert row["profile"] == "HYDROCARBON_CANDIDATE"
              assert row["physical_binding"] == "OPEN"
              assert row["ranking_allowed"] is False
              assert row["final_snapshot"]["step"] == 10000
          PY

      - name: Upload dropout artifact
        uses: actions/upload-artifact@v4
        with:
          name: hydrocarbon-closure-dropout-v01
          path: hydrocarbon_dropout_artifact/
          if-no-files-found: error
