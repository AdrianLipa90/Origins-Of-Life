name: Exotic Localization Lifecycle v0.1

on:
  pull_request:
    paths:
      - 'origins/exobiology/**'
      - 'tests/test_exotic_localization_lifecycle_v01.py'
      - 'scripts/run_exotic_localization_lifecycle.py'
      - '.github/workflows/exotic-localization-lifecycle-v01.yml'
  push:
    branches:
      - main
    paths:
      - 'origins/exobiology/**'
      - 'scripts/run_exotic_localization_lifecycle.py'
      - '.github/workflows/exotic-localization-lifecycle-v01.yml'

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas pytest

      - name: Run localization lifecycle diagnostic
        run: |
          python scripts/run_exotic_localization_lifecycle.py \
            --outdir exotic_localization_lifecycle_artifact \
            --horizon 3000 \
            --nx 24 \
            --ny 24 \
            --seeds 11 23 47

      - name: Validate lifecycle artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("exotic_localization_lifecycle_artifact/exotic_localization_lifecycle_v01.json")
          data = json.loads(p.read_text())
          m = data["manifest"]
          assert m["schema"] == "ORIGINS_EXOTIC_LOCALIZATION_LIFECYCLE_V0_1"
          assert m["parameter_tuning_allowed"] is False
          assert m["threshold_tuning_allowed"] is False
          assert m["ranking_allowed"] is False
          assert data["row_count"] == 12

          for row in data["rows"]:
              assert row["physical_binding"] == "OPEN"
              assert row["ranking_allowed"] is False
              for key in (
                  "max_information_threshold_fraction",
                  "max_boundary_threshold_fraction",
                  "final_information_threshold_fraction",
                  "final_boundary_threshold_fraction",
              ):
                  assert 0.0 <= row[key] <= 1.0
              assert row["longest_closed_boundary_run"] <= row["closed_boundary_steps"]
          PY

      - name: Upload lifecycle artifact
        uses: actions/upload-artifact@v4
        with:
          name: exotic-localization-lifecycle-v01
          path: exotic_localization_lifecycle_artifact/
          if-no-files-found: error
