name: Matched Ablation Long Horizon

on:
  pull_request:
    paths:
      - "origins/analysis/ablation.py"
      - "origins/simulator/universal.py"
      - "origins/topology/constraints.py"
      - "scripts/run_matched_ablation.py"
      - ".github/workflows/matched-ablation-long-horizon.yml"

jobs:
  long-horizon:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario: [A, C]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy

      - name: Run 120 h matched factorial ablation
        run: |
          python scripts/run_matched_ablation.py \
            --scenario ${{ matrix.scenario }} \
            --seeds 101,102,103,104,105 \
            --hours 120 \
            --nx 32 \
            --ny 32 \
            --dt-h 0.05 \
            --outdir ablation_long_${{ matrix.scenario }}

      - name: Upload long-horizon artifact
        uses: actions/upload-artifact@v4
        with:
          name: matched-ablation-long-${{ matrix.scenario }}
          path: ablation_long_${{ matrix.scenario }}/
          if-no-files-found: error
